name: CI

on:
  push:
    branches: [main, node-esm]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check imports are Node-ESM ready
        run: npm run codemod:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          CI: "true"

      - name: Build
        run: npm run build:lib

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/reports/
          retention-days: 30
